[project]
name = "nn-train"
version = "0.1.0"
description = "DVC training pipeline for the neural network mini-library"
authors = [{name = "Alex Mikheev"}]
requires-python = ">=3.12"
dependencies = [
    "nn-lib",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "dvc[s3]>=3.50.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nn_train"]
