stages:
  tokenize:
    cmd: uv run python -m rawformer_train.prepare
    deps:
      - data/pretrain/stories.txt
      - train/rawformer_train/prepare.py
    params:
      - tokenize
    outs:
      - artifacts/tokenizer/tokenizer.json
      - artifacts/tokenizer/train_ids.npy
      - artifacts/tokenizer/val_ids.npy
    metrics:
      - artifacts/tokenizer/tokenize-metrics.json:
          cache: false

  pretrain:
    cmd: uv run python -m rawformer_train.pretrain
    deps:
      - artifacts/tokenizer/tokenizer.json
      - artifacts/tokenizer/train_ids.npy
      - artifacts/tokenizer/val_ids.npy
      - lib/rawformer/training/clm.py
      - lib/rawformer/training/lm_trainer.py
      - train/rawformer_train/pretrain.py
    params:
      - pretrain
    outs:
      - artifacts/pretrain/model.pkl
    metrics:
      - artifacts/pretrain/pretrain-metrics.json:
          cache: false

  sft:
    cmd: uv run python -m rawformer_train.sft
    deps:
      - artifacts/pretrain/model.pkl
      - artifacts/tokenizer/tokenizer.json
      - data/sft/instructions.jsonl
      - lib/rawformer/training/clm.py
      - lib/rawformer/training/lm_trainer.py
      - train/rawformer_train/sft.py
    params:
      - sft
    outs:
      - artifacts/sft/model.pkl
    metrics:
      - artifacts/sft/sft-metrics.json:
          cache: false

  align:
    cmd: uv run python -m rawformer_train.align
    deps:
      - artifacts/sft/model.pkl
      - artifacts/tokenizer/tokenizer.json
      - data/dpo/preferences.jsonl
      - lib/rawformer/training/clm.py
      - lib/rawformer/training/dpo.py
      - train/rawformer_train/_utils.py
      - train/rawformer_train/align.py
    params:
      - align
    outs:
      - artifacts/align/model.pkl
    metrics:
      - artifacts/align/align-metrics.json:
          cache: false
