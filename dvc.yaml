stages:
  prepare:
    cmd: uv run python -m rawformer_train.prepare
    deps:
      - data/iris.dat
      - train/rawformer_train/prepare.py
    params:
      - prepare
    outs:
      - artifacts/train_x.npy
      - artifacts/val_x.npy
      - artifacts/test_x.npy
      - artifacts/train_y.npy
      - artifacts/val_y.npy
      - artifacts/test_y.npy
      - artifacts/preprocessor.pkl
    metrics:
      - artifacts/prepare-metrics.json:
          cache: false

  train:
    cmd: uv run python -m rawformer_train.train
    deps:
      - artifacts/train_x.npy
      - artifacts/train_y.npy
      - artifacts/preprocessor.pkl
      - train/rawformer_train/train.py
      - lib/rawformer/activations.py
      - lib/rawformer/base.py
      - lib/rawformer/exceptions.py
      - lib/rawformer/initializers.py
      - lib/rawformer/layers.py
      - lib/rawformer/losses.py
      - lib/rawformer/network.py
      - lib/rawformer/preprocessing.py
      - lib/rawformer/trainer.py
    params:
      - train
    outs:
      - artifacts/model.pkl
    metrics:
      - artifacts/train-metrics.json:
          cache: false

  evaluate:
    cmd: uv run python -m rawformer_train.evaluate
    deps:
      - artifacts/model.pkl
      - artifacts/val_x.npy
      - artifacts/val_y.npy
      - artifacts/test_x.npy
      - artifacts/test_y.npy
      - train/rawformer_train/evaluate.py
    metrics:
      - artifacts/evaluate-metrics.json:
          cache: false
