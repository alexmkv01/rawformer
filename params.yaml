tokenize:
  vocab_size: 512
  max_seq_len: 128
  val_split: 0.15
  random_seed: 42

pretrain:
  d_model: 64
  n_heads: 4
  n_layers: 2
  d_ff: 256
  max_len: 128
  dropout_rate: 0.1
  batch_size: 4
  epochs: 50
  learning_rate: 0.001
  random_seed: 42

sft:
  batch_size: 4
  epochs: 20
  learning_rate: 0.0005
  max_seq_len: 128
  random_seed: 42

align:
  batch_size: 2
  beta: 0.1
  epochs: 10
  learning_rate: 0.0001
  max_seq_len: 128
  random_seed: 42
