[project]
name = "nn-lib"
version = "0.1.0"
description = "A from-scratch neural network library built with NumPy"
authors = [{name = "Alex Mikheev"}]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nn_lib"]
